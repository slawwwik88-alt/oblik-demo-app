name: Build navigation fix APK

on:
  workflow_dispatch:
  push:
    branches: [fix/tab-flicker]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install stable demo signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Test navigation and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Oblik-Demo-v13
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

