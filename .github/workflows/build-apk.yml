name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore demo project
        shell: bash
        run: |
          mkdir -p work
          cat > /tmp/project.b64 <<'B64EOF'
          
          B64EOF
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d work

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: work/oblik_demo_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oblik-Demo-APK
          path: work/oblik_demo_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

